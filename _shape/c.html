<p>श्री रामकृष्ण मन्दिरम् - रामकृष्ण मठ</p>
<p>हृदयकमलमध्ये राजितं निर्विकल्पं</p>
<p>प्रकृतिविकृतिशून्यं नित्यमानन्दमूर्तिं</p>
<p>विमलपरमहंसं रामकृष्णं भजामः ॥</p>
