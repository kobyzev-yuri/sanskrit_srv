# Optional local stack. Production on freevpn uses systemd + SQLite
# (see deploy/sanskrit-srv.service) because the VPS has ~1GB RAM.
services:
  api:
    image: python:3.12-slim
    working_dir: /app/backend
    command: >
      bash -lc "pip install -q -r requirements.txt &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: sqlite:////data/sanskrit_srv.db
      JWT_SECRET: dev-secret
      STORAGE_ROOT: /data/storage
      PYTHONPATH: /app/backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - srvdata:/data

volumes:
  srvdata:
