services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sanskrit
      POSTGRES_PASSWORD: sanskrit
      POSTGRES_DB: sanskrit_srv
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  # api / worker — подключатся на этапе реализации
  # api:
  #   build: ./backend
  #   command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  #   env_file: .env.example
  #   ports: ["8000:8000"]
  #   depends_on: [db, redis]

volumes:
  pgdata:
